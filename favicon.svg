<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Luxury Midnight Obsidian / Sapphire -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Ambient Center Blue Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#1D4ED8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Golden Ambient Halo for Coin -->
    <radialGradient id="coinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- 24K Luxury Gold Metallic Gradient (Rim) -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="18%" stop-color="#FDE047" />
      <stop offset="48%" stop-color="#F59E0B" />
      <stop offset="82%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Coin Face Gradient (Brushed Rich Gold) -->
    <linearGradient id="coinFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Wallet Back Leather Gradient -->
    <linearGradient id="walletBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Wallet Front Pocket Gradient (Deep Rich Sapphire with Top Sheen) -->
    <linearGradient id="walletFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="18%" stop-color="#1D4ED8" />
      <stop offset="65%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0B1329" />
    </linearGradient>

    <!-- Clasp Strap Gradient -->
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Emerald Stone Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Soft Realistic Drop Shadows -->
    <filter id="shadowWallet" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#020617" flood-opacity="0.7" />
    </filter>
    <filter id="shadowCoin" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#451A03" flood-opacity="0.55" />
    </filter>
    <filter id="shadowClasp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Ambient Glows -->
  <circle cx="256" cy="275" r="230" fill="url(#ambientGlow)" />
  <circle cx="256" cy="180" r="135" fill="url(#coinGlow)" />

  <!-- ==================== 1. GOLDEN WEALTH COIN ==================== -->
  <g filter="url(#shadowCoin)">
    <!-- Outer Rim -->
    <circle cx="256" cy="182" r="88" fill="url(#goldRim)" stroke="#FFFDF0" stroke-width="2.5" />
    
    <!-- Outer Bevel Ring -->
    <circle cx="256" cy="182" r="77" fill="none" stroke="#FDE68A" stroke-width="2.2" opacity="0.85" />
    
    <!-- Inner Coin Face -->
    <circle cx="256" cy="182" r="73" fill="url(#coinFace)" stroke="#B45309" stroke-width="1.5" />

    <!-- Coin Beaded Border (Milled Coin Edge) -->
    <circle cx="256" cy="182" r="66" fill="none" stroke="#FFFBEB" stroke-width="1.8" stroke-dasharray="3.5,3" opacity="0.65" />

    <!-- Wealth Emblem: 4-Point Regal Diamond Star (✦) -->
    <!-- Star Glow / Shadow -->
    <path d="M 256 134 Q 256 182 304 182 Q 256 182 256 230 Q 256 182 208 182 Q 256 182 256 134 Z"
          fill="#78350F" opacity="0.3" transform="translate(1, 2)" />
    
    <!-- Primary Regal Star Body -->
    <path d="M 256 134 Q 256 182 304 182 Q 256 182 256 230 Q 256 182 208 182 Q 256 182 256 134 Z"
          fill="#FFFDF0" />

    <!-- Star Core Facet Highlight -->
    <path d="M 256 152 Q 256 182 286 182 Q 256 182 256 212 Q 256 182 226 182 Q 256 182 256 152 Z"
          fill="#FEF08A" opacity="0.85" />

    <!-- Center Diamond Core -->
    <circle cx="256" cy="182" r="4.5" fill="#B45309" />
    <circle cx="255" cy="181" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- ==================== 2. LUXURY WALLET BODY ==================== -->
  <g filter="url(#shadowWallet)">
    <!-- Back Shell of Wallet -->
    <rect x="124" y="218" width="264" height="176" rx="32"
          fill="url(#walletBack)"
          stroke="url(#goldRim)" stroke-width="2.5" />

    <!-- Front Pocket of Wallet (Graceful curved cutaway) -->
    <path d="M 124 260 Q 256 295 388 260 L 388 362 A 32 32 0 0 1 356 394 L 156 394 A 32 32 0 0 1 124 362 Z"
          fill="url(#walletFront)"
          stroke="url(#goldRim)" stroke-width="2.5" />

    <!-- Refined Stitching Line along Front Pocket Curve -->
    <path d="M 134 268 Q 256 303 378 268"
          fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6,4" opacity="0.65" />

    <!-- ==================== 3. WALLET CLASP (Khóa Ví Vàng & Ngọc Lục Bảo) ==================== -->
    <g transform="translate(348, 274)" filter="url(#shadowClasp)">
      <!-- Leather Clasp Flap -->
      <path d="M 0 0 L 28 0 A 20 20 0 0 1 48 20 A 20 20 0 0 1 28 40 L 0 40 Z"
            fill="url(#claspGrad)"
            stroke="url(#goldRim)" stroke-width="2" />
      
      <!-- Gold Metal Snap Rim -->
      <circle cx="26" cy="20" r="12" fill="url(#goldRim)" stroke="#FFFDF0" stroke-width="1.5" />
      
      <!-- Emerald Gem Inlay -->
      <circle cx="26" cy="20" r="7" fill="url(#emeraldGrad)" />
      
      <!-- Gem Highlight -->
      <circle cx="24" cy="18" r="2.5" fill="#A7F3D0" />
      <circle cx="23" cy="17" r="1.2" fill="#FFFFFF" />
    </g>
  </g>
</svg>
