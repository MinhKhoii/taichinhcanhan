<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Shaded Area Under Line -->
  <path d="M 112 348 L 215 256 L 286 307 L 390 164 L 390 399 L 112 399 Z" fill="url(#wave)" />

  <!-- Main Trend Line with Soft Shadow -->
  <g filter="url(#shadow)">
    <polyline points="112,348 215,256 286,307 390,164" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="308,164 390,164 390,246" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Emerald Success Glowing Dot -->
  <circle cx="414" cy="140" r="28" fill="#10B981" />
  <circle cx="410" cy="136" r="10" fill="#A7F3D0" />
</svg>
